<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Дуэль хомячков</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="https://dvor-play.ru/sdk.js"></script>
  </head>
  <body>
    <div id="app">
      <section id="lobby" class="screen">
        <header class="lobby-head">
          <h1>Дуэль хомячков</h1>
          <p id="lobby-player">загрузка…</p>
        </header>

        <div class="lobby-body">
          <div class="lobby-rankings">
            <div class="lobby-card">
              <h2>Рейтинг</h2>
              <div class="champions-head" aria-hidden="true">
                <span>#</span>
                <span>Игрок</span>
                <span>Очки</span>
                <span>Победы</span>
                <span>Игры</span>
              </div>
              <ol id="board-rating" class="champions"></ol>
              <p id="board-rating-empty" class="muted">Пока пусто.</p>
            </div>
          </div>

          <div class="lobby-card lobby-card--action">
            <p id="my-stats" class="my-stats muted">Ваша статистика загрузится после входа.</p>
            <div class="color-picker" id="color-picker">
              <p class="color-picker__label">Цвет позиции</p>
              <div class="color-swatches" id="color-swatches"></div>
              <p id="color-status" class="muted"></p>
            </div>
            <button type="button" id="join" disabled>В бой</button>
            <p id="lobby-status" class="muted"></p>
          </div>
        </div>
      </section>

      <section id="match" class="screen" hidden>
        <header id="top">
          <h1>Дуэль хомячков</h1>
          <p id="status">ожидание…</p>
          <p id="timer" hidden></p>
          <button type="button" id="cancel-wait" class="btn-ghost" hidden>
            В лобби
          </button>
        </header>

        <main id="arena">
          <aside class="side" id="side-left" data-side="left">
            <div class="portrait" aria-hidden="true"></div>
            <p class="name">Игрок 1</p>
            <p class="score">0</p>
          </aside>

          <div id="board-stage">
            <p id="go-countdown" hidden aria-live="assertive"></p>
            <section id="board" aria-label="Поле 3 на 3">
              <button type="button" class="cell" data-cell="0" aria-label="Ячейка 1"></button>
              <button type="button" class="cell" data-cell="1" aria-label="Ячейка 2"></button>
              <button type="button" class="cell" data-cell="2" aria-label="Ячейка 3"></button>
              <button type="button" class="cell" data-cell="3" aria-label="Ячейка 4"></button>
              <button type="button" class="cell" data-cell="4" aria-label="Ячейка 5"></button>
              <button type="button" class="cell" data-cell="5" aria-label="Ячейка 6"></button>
              <button type="button" class="cell" data-cell="6" aria-label="Ячейка 7"></button>
              <button type="button" class="cell" data-cell="7" aria-label="Ячейка 8"></button>
              <button type="button" class="cell" data-cell="8" aria-label="Ячейка 9"></button>
            </section>
          </div>

          <aside class="side" id="side-right" data-side="right">
            <div class="portrait" aria-hidden="true"></div>
            <p class="name">Игрок 2</p>
            <p class="score">0</p>
          </aside>
        </main>
      </section>

      <div id="overlay" hidden>
        <div class="overlay-card">
          <p id="overlay-title"></p>
          <p id="overlay-sub"></p>
          <div class="overlay-scoreboard" aria-label="Счёт матча">
            <div class="overlay-fighter is-me">
              <div
                class="overlay-portrait"
                id="overlay-me-portrait"
                aria-hidden="true"
              ></div>
              <p class="overlay-fighter-name" id="overlay-me-name">Вы</p>
              <p class="overlay-fighter-score" id="overlay-me-score">0</p>
            </div>
            <span class="overlay-vs" aria-hidden="true">—</span>
            <div class="overlay-fighter">
              <div
                class="overlay-portrait"
                id="overlay-foe-portrait"
                aria-hidden="true"
              ></div>
              <p class="overlay-fighter-name" id="overlay-foe-name">Соперник</p>
              <p class="overlay-fighter-score" id="overlay-foe-score">0</p>
            </div>
          </div>
          <div class="overlay-actions">
            <button type="button" id="again">Ещё раз</button>
            <button type="button" id="to-lobby" class="btn-ghost">В лобби</button>
          </div>
        </div>
      </div>
    </div>

    <div id="cursor-hammer" aria-hidden="true" hidden></div>
    <script src="./app.js" defer></script>
  </body>
</html>
